<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer</title>
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#d32f2f">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-wrapper">
        <header>
            <button id="theme-toggle" title="Toggle Dark Mode">
                <i class="fas fa-moon"></i>
            </button>
            <button id="settings-toggle" title="Settings">
                <i class="fas fa-cog"></i>
            </button>
        </header>

        <div class="container">
            <div id="digital-clock" class="animate-fade-down">00:00:00</div>
            <h1 class="animate-fade-down">Study Timer</h1>
            
            <div class="timer-container animate-fade-in">
                <div id="timer">25:00</div>
                <div class="controls">
                    <button id="start-btn" class="btn-primary">Start</button>
                    <button id="pause-btn" class="btn-secondary">Pause</button>
                    <button id="reset-btn" class="btn-secondary">Reset</button>
                </div>
                <div class="mode-controls">
                    <button id="work-mode-btn" class="active">Work</button>
                    <button id="break-mode-btn">Break</button>
                </div>
            </div>

            <div class="tasks-container animate-slide-up">
                <h2>To Do</h2>
                <div class="input-group">
                    <input type="text" id="task-input" placeholder="What are you working on?">
                    <button id="add-task-btn"><i class="fas fa-plus"></i></button>
                </div>
                <ul id="task-list">
                    <!-- Active Tasks -->
                </ul>

                <h3 class="completed-header">Completed</h3>
                <ul id="completed-task-list">
                    <!-- Completed Tasks -->
                </ul>
            </div>

            <div class="calendar-container animate-slide-up">
                <div class="calendar-header">
                    <span id="month-name">Month</span>
                    <span id="year">Year</span>
                </div>
                <div class="calendar-body" id="calendar-body">
                    <!-- Calendar grid generated by JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content animate-zoom-in">
            <span class="close-modal">&times;</span>
            <h2>Settings</h2>
            <div class="setting-group">
                <label for="work-duration">Work Duration (minutes):</label>
                <input type="number" id="work-duration" value="25" min="1" max="60">
            </div>
            <div class="setting-group">
                <label for="break-duration">Break Duration (minutes):</label>
                <input type="number" id="break-duration" value="5" min="1" max="60">
            </div>
            <button id="save-settings-btn" class="btn-primary">Save</button>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="alarm-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
